<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${reportTitle}">YUAN Report Template</title>
    <style>
        :root {
            --ink: #102a43;
            --muted: #627d98;
            --line: #d9e2ec;
            --accent: #0b7285;
            --surface: #f8fbfd;
            --warn: #c92a2a;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", sans-serif;
            color: var(--ink);
            background: linear-gradient(180deg, #f4f7fb 0%, #eef5f7 100%);
        }

        .page {
            max-width: 1080px;
            margin: 32px auto;
            padding: 24px;
        }

        .hero,
        .section {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 18px 60px rgba(16, 42, 67, 0.08);
        }

        .hero {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .meta-item {
            padding: 14px 16px;
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--line);
        }

        .meta-label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .meta-value {
            font-size: 18px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 20px;
        }

        h1, h2, h3 { margin: 0 0 12px; }
        h1 { font-size: 30px; }
        h2 { font-size: 20px; }
        p, li { line-height: 1.7; }
        ul { margin: 0; padding-left: 20px; }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(11, 114, 133, 0.12);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .risk-high {
            color: var(--warn);
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .meta,
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <section class="hero">
        <div>
            <span class="badge">YUAN Report Template</span>
            <h1 th:text="${reportTitle}">压测分析报告</h1>
            <p th:text="${reportSubtitle}">用于展示 run 级分析结果、瓶颈归因和建议动作的默认 HTML 模板。</p>
        </div>
        <div class="meta">
            <div class="meta-item">
                <span class="meta-label">任务 ID</span>
                <span class="meta-value" th:text="${taskId}">2001</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">运行 ID</span>
                <span class="meta-value" th:text="${runId}">1001</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">等级</span>
                <span class="meta-value" th:text="${grade}">B</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">总分</span>
                <span class="meta-value" th:text="${score}">82</span>
            </div>
        </div>
    </section>

    <div class="grid">
        <section class="section">
            <h2>执行摘要</h2>
            <p th:text="${summary}">这里展示本次压测最重要的结论摘要。</p>

            <h3>主要瓶颈</h3>
            <ul>
                <li th:each="item : ${bottlenecks}" th:text="${item}">示例瓶颈：P99 延迟持续高于 2s。</li>
            </ul>
        </section>

        <section class="section">
            <h2>建议动作</h2>
            <ul>
                <li th:each="item : ${suggestions}" th:text="${item}">示例建议：优先检查数据库慢 SQL 与连接池上限。</li>
            </ul>

            <h3>风险等级</h3>
            <p class="risk-high" th:text="${riskLevel}">HIGH</p>
        </section>
    </div>
</div>
</body>
</html>
