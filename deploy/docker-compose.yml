services:
  mysql:
    image: mysql:8.0
    container_name: yuan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - yuan_mysql_data:/var/lib/mysql
      - ./sql/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./sql/01-nacos-schema.sql:/docker-entrypoint-initdb.d/01-nacos-schema.sql:ro
      - ./sql/01-schema-v1.sql:/docker-entrypoint-initdb.d/01-schema-v1.sql:ro
      - ./sql/02-seed-v1.sql:/docker-entrypoint-initdb.d/02-seed-v1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - yuan-backbone

  redis:
    image: redis:8.4.0
    container_name: yuan-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - yuan_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - yuan-backbone

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: yuan-rabbitmq
    restart: unless-stopped
    hostname: yuan-rabbitmq
    environment:
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_PRODUCER_PASSWORD: ${RABBITMQ_PRODUCER_PASSWORD}
      RABBITMQ_CONSUMER_PASSWORD: ${RABBITMQ_CONSUMER_PASSWORD}
      TZ: ${TZ}
    command:
      - /bin/bash
      - -lc
      - set -e; rabbitmq-server & pid=$$!; bash /opt/yuan/rabbitmq/init.sh; wait $$pid
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - yuan_rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/init.sh:/opt/yuan/rabbitmq/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmqctl list_users | awk '{print $$1}' | grep -qx admin && rabbitmqctl list_users | awk '{print $$1}' | grep -qx producer && rabbitmqctl list_users | awk '{print $$1}' | grep -qx consumer"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - yuan-backbone

  nacos:
    image: nacos/nacos-server:v3.1.0
    container_name: yuan-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8849:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/8848'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - yuan-backbone

  yuan-auth:
    container_name: yuan-auth
    build:
      context: .
      dockerfile: ./server/Dockerfile.jvm
      args:
        JAR_FILE: server/yuan-auth-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    env_file:
      - ./server/env/common.env
      - ./server/env/yuan-auth.env
    environment:
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - yuan-backbone

  yuan-test:
    container_name: yuan-test
    build:
      context: .
      dockerfile: ./server/Dockerfile.jvm
      args:
        JAR_FILE: server/yuan-test-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    env_file:
      - ./server/env/common.env
      - ./server/env/yuan-test.env
    environment:
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_PRODUCER_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "8082:8082"
    volumes:
      - ${JMETER_HOME}:/opt/jmeter:ro
      - ${JMETER_RESULTS_DIR}:/data/jmeter/results
      - ${JMETER_SCRIPTS_DIR}:/data/jmeter/scripts
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/actuator/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - yuan-backbone

  yuan-monitor:
    container_name: yuan-monitor
    build:
      context: .
      dockerfile: ./server/Dockerfile.jvm
      args:
        JAR_FILE: server/yuan-monitor-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    env_file:
      - ./server/env/common.env
      - ./server/env/yuan-monitor.env
    environment:
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_CONSUMER_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/actuator/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - yuan-backbone

  yuan-analysis:
    container_name: yuan-analysis
    build:
      context: .
      dockerfile: ./server/Dockerfile.jvm
      args:
        JAR_FILE: server/yuan-analysis-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    env_file:
      - ./server/env/common.env
      - ./server/env/yuan-analysis.env
    environment:
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_CONSUMER_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/actuator/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - yuan-backbone

  yuan-report:
    container_name: yuan-report
    build:
      context: .
      dockerfile: ./server/Dockerfile.jvm
      args:
        JAR_FILE: server/yuan-report-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    env_file:
      - ./server/env/common.env
      - ./server/env/yuan-report.env
    environment:
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      yuan-analysis:
        condition: service_healthy
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/actuator/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - yuan-backbone

  yuan-gateway:
    container_name: yuan-gateway
    build:
      context: .
      dockerfile: ./server/Dockerfile.jvm
      args:
        JAR_FILE: server/yuan-gateway-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    env_file:
      - ./server/env/common.env
      - ./server/env/yuan-gateway.env
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      yuan-auth:
        condition: service_healthy
      yuan-test:
        condition: service_healthy
      yuan-monitor:
        condition: service_healthy
      yuan-analysis:
        condition: service_healthy
      yuan-report:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - yuan-backbone

  yuan-web:
    image: nginx:1.28.0
    container_name: yuan-web
    restart: unless-stopped
    depends_on:
      yuan-gateway:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/yuan-web.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - yuan-backbone

volumes:
  yuan_mysql_data:
  yuan_redis_data:
  yuan_rabbitmq_data:

networks:
  yuan-backbone:
    name: yuan-backbone








